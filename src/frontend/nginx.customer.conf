# 双端口部署：platform :3001 + client :4001（同一台宿主机，nginx 直跑在主机上）
#
# 用法：把本文件放到 /etc/nginx/conf.d/ 下（conf.d/*.conf 会被 include 进 http 块），
# 或 `include` 进 nginx.conf 的 http 块，然后 nginx -t && nginx -s reload。
#
# ⚠️ 若你的 nginx 里已经定义了 $connection_upgrade 这个 map（例如同时挂了仓库里
#    docker/nginx/conf.d/default.conf），删掉下面这段 map，否则 nginx 启动报
#    "duplicate map ..." 错误。
#
# 改部署地址时只需动三处：两个 origin（构建期变量，见下方注释）、两个 root/alias
# 路径、以及 MinIO 的 sharepoint 地址。
#
# 产物布局（换目录名时同步改下面两处 root/alias）：
#   platform:  src/frontend/platform → npm run build → 把 build/ 的**内容**放到
#              /usr/local/nginx/html/platform_dist        （vite base = /）
#   client:    src/frontend/client   → npm run build → 把 build/ 的**内容**放到
#              /usr/local/nginx/html/client_dist          （vite base = /workspace）
#   ⚠️ 是倒进 build/ 里的东西，不是把 build 这层目录本身拷进去 —— 多套一层会让
#      alias 找不到 index.html，浏览器只看到一个干巴巴的 403，很难查。

# 支持 websocket（SSE/chat 长连接需要）
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

upstream jinbao_backend {
	server 172.19.70.189:7860;  # backend api
}


# ─────────────────────────────────────────────────────────────────────────────
# :3001 — platform（管理端）
#   产物：platform/build（vite base = /，assets 在产物根目录）
#   注意：本 vhost 不再反代 /workspace —— 工作台已经是独立服务（:4001），
#   平台里的跳转走 VITE_WORKSPACE_ORIGIN 的绝对地址。
# ─────────────────────────────────────────────────────────────────────────────
server {
	listen 3001;

	gzip on;
	gzip_comp_level  2;
	gzip_min_length  1000;
	gzip_types  text/xml text/css;
	gzip_http_version 1.1;
	gzip_vary  on;
	gzip_disable "MSIE [4-6] \.";

	# ← 改成 platform 产物在服务器上的实际路径（vite base = /，故用 root）
	root /usr/local/nginx/html/platform_dist;
	index index.html index.htm;

	location / {
		index index.html index.htm;
		# 禁止浏览器缓存 index.html（否则发版后仍跑旧版本）
		location = /index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /index.html;
		add_header X-Frame-Options SAMEORIGIN;
	}

	# 旧书签/旧链接兜底：以前工作台挂在 :3001/workspace/
    location /workspace {
    	return 302 http://172.19.70.189:4001/workspace/;
    }

	# /health 与平台 dev 代理的 apiRoutes 对齐（client 侧没有这条）
	location ~ ^/(api|health)(/|$) {
		proxy_pass http://jinbao_backend;
		proxy_read_timeout 300s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		client_max_body_size 1024m;
		add_header X-Frame-Options SAMEORIGIN;
	}

	location ~ ^/(bisheng|tmp-dir)/ {
		proxy_pass http://172.19.70.189:9100;
	}
}


# ─────────────────────────────────────────────────────────────────────────────
# :4001 — client（工作台）
#   vite base = /workspace，所以产物挂在 /workspace/ 前缀下，且 assets 在产物
#   根目录 —— 必须用 alias（root 会把 /workspace 也算进路径，找不到文件）。
#   client 的接口是 /workspace/api/...（axios baseURL = import.meta.env.BASE_URL），
#   故下面的反代要先把 /workspace 前缀剥掉。
# ─────────────────────────────────────────────────────────────────────────────
server {
	listen 4001;

	gzip on;
	gzip_comp_level  2;
	gzip_min_length  1000;
	gzip_types  text/xml text/css;
	gzip_http_version 1.1;
	gzip_vary  on;
	gzip_disable "MSIE [4-6] \.";

	# 根路径进门就送到 /workspace/
	location = / {
		return 302 /workspace/;
	}

	location = /workspace {
		return 302 /workspace/;
	}

	location /workspace/ {
		# ← 改成 client 产物在服务器上的实际路径。
		alias /usr/local/nginx/html/client_dist/;
		index index.html index.htm;
		# ⚠️ 嵌套的 location 不继承 alias 的裁剪长度，只在 alias 带结尾斜杠时
		#    才拼得对。改完 alias 必须回归验证 /workspace/ 和/workspace/index.html 两个地址都能打开（且状态 200）。
		location = /workspace/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /workspace/index.html;
		# 这里不要加 X-Frame-Options：平台的 bench 预览会跨域 iframe 本站。
	}

	location ~ ^/workspace/api(/|$) {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://jinbao_backend;
		proxy_read_timeout 300s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		client_max_body_size 1024m;
	}

	# ⚠️ 不要删这条：后端返回的预签名 URL 是「剥掉主机名」的相对路径
	#    （clear_minio_share_host 会把 http://172.19.70.189:9100 这段删掉），
	#    浏览器按同源解析 → 落在本 vhost 的 /tmp-dir/... 、/bisheng/... 上。
	#    3001 的 vhost 有对应规则，client 侧同样必须有，否则聊天窗生成的文件
	#    预览/下载直接 404（2026-09-17 线上踩过）。
	#    这里不要加 rewrite：URI 必须原样透传，否则 SigV4 的 canonical URI
	#    对不上 → 403 SignatureDoesNotMatch。
	location ~ ^/(bisheng|tmp-dir)/ {
		proxy_pass http://172.19.70.189:9100;
	}

	location ~ ^/workspace/(bisheng|tmp-dir)/ {
		rewrite ^/workspace(/.*)$ $1 break;
		# 同上：Host 必须等于 MinIO 的 sharepoint。
		proxy_pass http://172.19.70.189:9100;
	}

	# 兜底：未匹配的路径不要再落到 nginx 默认站点根，那里是自带的
	# "Welcome to nginx!" 页 —— 配置错了也只会看到 200 的欢迎页，很难查。
	location / {
		return 404;
	}
}
