# 本地开发配置 (gitignored) —— 指向 127.0.0.1 上的共享中间件栈
# 密码必须是 Fernet 密文：Settings.set_database_url / set_redis_url 在加载时无条件
# 调用 decrypt_token()，写明文会直接抛 InvalidToken 导致启动失败。
# 加密工具：bisheng/core/config/settings.py::encrypt_token
database_url:
  "mysql+pymysql://root:gAAAAABlp4b4c59FeVGF_OQRVf6NOUIGdxq8246EBD-b0hdK_jVKRs1x4PoAn0A6C5S6IiFKmWn0Nm5eBUWu-7jxcqw6TiVjQA==@127.0.0.1:3306/bisheng?charset=utf8mb4"

database_pool:
  pool_size: 50      # 每进程常驻连接数
  max_overflow: 20   # 高峰允许超出 pool_size 的临时连接数
  pool_timeout: 30   # 等待空闲连接的超时秒数
  pool_recycle: 3600 # 连接最大存活秒数，超过则回收重建
  pool_pre_ping: true
  ssl:
    enabled: false

# 缓存（该 Redis 实例未设密码，故 URL 中无凭据段；无 @ 时不会触发解密）
redis_url: "redis://127.0.0.1:6379/1"

# Celery broker（与缓存分库，避免 Celery 运维操作清掉业务缓存）
celery_redis_url: "redis://127.0.0.1:6379/2"

openfga:
  enabled: true
  api_url: "http://127.0.0.1:18080"

sso_sync:
  gateway_hmac_secret: "bisheng-local-hmac-20260422"
  signature_header: "X-Signature"

knowledge_file_worker:
  ocr_queue_enabled: false
  ocr_queue: "ocr_celery"
  fair_scheduler_enabled: false
  fair_scheduler:
    dispatch_lock_ttl_seconds: 24
    queue_concurrency:
      knowledge_celery: 20
      ocr_celery: 5
    per_user_pick_size: 1
    user_overrides: {"1": 3}
    inflight_ttl_seconds: 7200

celery_task:
  task_routers:
    bisheng.worker.knowledge.*:
      queue: knowledge_celery

# 以下值原先用 !env ${VAR} 占位（容器由 docker-compose 注入）。本地开发直接内联，
# 免去导出 10 个环境变量；!env 引用不存在的变量会直接报错。
vector_stores:
  milvus:
    connection_args: '{"host":"127.0.0.1","port":"19530","user":"","password":"","secure":false}'
    is_partition: 'true'
    partition_suffix: '1'
  elasticsearch:
    url: 'http://127.0.0.1:9200'
    ssl_verify: '{}'

object_storage:
  type: minio
  minio:
    schema: 'false'
    cert_check: 'false'
    endpoint: '127.0.0.1:9100'
    # sharepoint 必须与 endpoint 主机名完全一致，否则预签名 URL 的 SigV4 Host 校验失败 → 全部 403
    sharepoint: '127.0.0.1:9100'
    access_key: 'minioadmin'
    secret_key: 'minioadmin'
    public_bucket: 'bisheng'
    tmp_bucket: 'tmp-dir'
  # 本地文件系统存储：type 改为 local 后生效（此时 minio 段可留可删）
  local:
    root: ./data/storage            # 本地存储根目录，实际布局为 {root}/{bucket}/{object_name}
    public_bucket: bisheng          # 持久文件目录
    tmp_bucket: tmp-dir             # 临时文件目录，按 tmp_expire_days 定期清理
    tmp_expire_days: 3              # 临时文件保留天数
    share_host: ""                  # 对外可访问地址前缀，留空则用相对路径

environment:
  env: dev
  uns_support: ['png','jpg','jpeg','bmp','doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx', 'txt', 'md', 'html', 'pdf', 'csv', 'tiff']

logger_conf:
  level: DEBUG
  format: '<level>[{time:YYYY-MM-DD HH:mm:ss.SSSSSS}] [{level.name} process-{process.id}-{thread.id} {name}:{line}]</level> - <level>trace={extra[trace_id]} {message}</level>'
  handlers:
    # 原值为容器内绝对路径 /app/data/*.log；本地开发改为相对路径，
    # 落在 src/backend/data/（该目录已被 .gitignore 忽略）。
    - sink: "data/bisheng.log"
      level: INFO
      format: '<level>[{time:YYYY-MM-DD HH:mm:ss.SSSSSS}] [{level.name} process-{process.id}-{thread.id} {name}:{line}]</level> - <level>trace={extra[trace_id]} {message}</level>'
      rotation: "00:00"
      retention: "3 Days"
      enqueue: true
