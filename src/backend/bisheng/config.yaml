# 本地开发配置 (gitignored) —— 指向 127.0.0.1 上的共享中间件栈
# 密码必须是 Fernet 密文：Settings.set_database_url / set_redis_url 在加载时无条件
# 调用 decrypt_token()，写明文会直接抛 InvalidToken 导致启动失败。
# 加密工具：bisheng/core/config/settings.py::encrypt_token
#database_url:
#  "mysql+pymysql://root:gAAAAABqzE_HJa5FJCm6Q338o9ZsbAjNEjNZR3N2JAF7eqjMPGgmc5ANMOjbT1surVrwmhXZXJcIcl7-XkKkDBMWI9lsG6bocA==@127.0.0.1:3306/bisheng_database?charset=utf8mb4"
database_url: "mysql+pymysql://root:gAAAAABqzKZdM9XjMXjqSMkyArcR_LSfpbXsliC_t83zePyQvU7yDhEHLuh2pjQGj3HLlJbXaM9Jng6LQdBiXe8wc3OQsN3Org==@172.19.70.107:3306/bisheng?charset=utf8mb4"

database_pool:
  pool_size: 50      # 每进程常驻连接数
  max_overflow: 20   # 高峰允许超出 pool_size 的临时连接数
  pool_timeout: 30   # 等待空闲连接的超时秒数
  pool_recycle: 3600 # 连接最大存活秒数，超过则回收重建
  pool_pre_ping: true
  ssl:
    enabled: false

# 缓存（该 Redis 实例未设密码，故 URL 中无凭据段；无 @ 时不会触发解密）
redis_url: "redis://172.19.70.107:6379/1"

# Celery broker（与缓存分库，避免 Celery 运维操作清掉业务缓存）
celery_redis_url: "redis://172.19.70.107:6379/2"

openfga:
  enabled: true
  api_url: "http://172.19.70.107:8080"

sso_sync:
  gateway_hmac_secret: "bisheng-local-hmac-20260422"
  signature_header: "X-Signature"

knowledge_file_worker:
  ocr_queue_enabled: false
  ocr_queue: "ocr_celery"
  fair_scheduler_enabled: false
  fair_scheduler:
    dispatch_lock_ttl_seconds: 24
    queue_concurrency:
      knowledge_celery: 20
      ocr_celery: 5
    per_user_pick_size: 1
    user_overrides: {"1": 3}
    inflight_ttl_seconds: 7200

celery_task:
  task_routers:
    bisheng.worker.knowledge.*:
      queue: knowledge_celery

# F077 定时任务（可选段；缺省即用代码默认值，见 core/config/scheduled_task.py）。
# 注意：扫描节拍不在这里配——beat 条目在 CeleryConf 里（scheduled_task_scan，默认 20 秒），
# 复制一份会变成两处真相。
# open_api:  # F076 开放 API 鉴权总闸（F077 事件触发同样依赖它）
#   enforce_keys: true                     # 部署总闸：false = 完全旧行为（连密钥都不校验）；开启需重启
#   credential_cache_ttl_seconds: 3        # 吊销生效上界，≤5
#   default_tenant_enforce_keys: false     # 启动时若默认租户【尚无】策略行，按此值播种；已有行不覆盖
#   public_base_url: ""                    # 对接方访问 /api/v2 的根地址（含端口与反代前缀）；留空则接入指南用本机探测值
#
# scheduled_task:
#   global_max_running: 10           # 全局同时运行的定时任务上限（AC-12）
#   max_tasks_per_app: 20            # 每应用启用中的任务上限（AC-05）
#   run_timeout_seconds: 3600        # 运行租约上限，秒（AC-15）
#   consecutive_failure_threshold: 5 # 连续失败自动停用阈值（AC-55）
#   replay_window_seconds: 300       # 事件触发防重放时间窗，秒（AC-37）
#   event_rate_limit_per_minute: 10  # 任务级触发频率上限（AC-38）
#   preset_input_max_items: 20       # 预设输入条数上限（AC-44）
#   preset_input_max_chars: 2000     # 预设输入单项字符上限（AC-44）
#   nl_max_chars: 2000               # 自然语言输入字符上限（AC-41）
#   preview_count: 5                 # 触发计划预览的未来次数（AC-07）
#   dispatch_lock_ttl_seconds: 15    # 扫描轮的平台级 Redis 锁 TTL（略小于节拍）

# 以下值原先用 !env ${VAR} 占位（容器由 docker-compose 注入）。本地开发直接内联，
# 免去导出 10 个环境变量；!env 引用不存在的变量会直接报错。
vector_stores:
  milvus:
    connection_args: '{"host":"172.19.70.107","port":"19530","user":"","password":"","secure":false}'
    is_partition: 'true'
    partition_suffix: '1'
  elasticsearch:
    url: 'http://172.19.70.107:9200'
    ssl_verify: '{}'

object_storage:
  type: minio
  minio:
    schema: 'false'
    cert_check: 'false'
    endpoint: '172.19.70.108:9000'
    # sharepoint 必须与 endpoint 主机名完全一致，否则预签名 URL 的 SigV4 Host 校验失败 → 全部 403
    sharepoint: '172.19.70.108:9000'
    access_key: 'minioadmin'
    secret_key: '9b97b6ab85e4ee35ec51c5033f0b6a96'
    public_bucket: 'bisheng'
    tmp_bucket: 'tmp-dir'
  # 本地文件系统存储：type 改为 local 后生效（此时 minio 段可留可删）
  local:
    root: ./data/storage            # 本地存储根目录，实际布局为 {root}/{bucket}/{object_name}
    public_bucket: bisheng          # 持久文件目录
    tmp_bucket: tmp-dir             # 临时文件目录，按 tmp_expire_days 定期清理
    tmp_expire_days: 3              # 临时文件保留天数
    share_host: ""                  # 对外可访问地址前缀，留空则用相对路径

environment:
  env: dev
  uns_support: ['png','jpg','jpeg','bmp','doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx', 'txt', 'md', 'html', 'pdf', 'csv', 'tiff']

logger_conf:
  level: DEBUG
  format: '<level>[{time:YYYY-MM-DD HH:mm:ss.SSSSSS}] [{level.name} process-{process.id}-{thread.id} {name}:{line}]</level> - <level>trace={extra[trace_id]} {message}</level>'
  handlers:
    # 原值为容器内绝对路径 /app/data/*.log；本地开发改为相对路径，
    # 落在 src/backend/data/（该目录已被 .gitignore 忽略）。
    - sink: "data/bisheng.log"
      level: INFO
      format: '<level>[{time:YYYY-MM-DD HH:mm:ss.SSSSSS}] [{level.name} process-{process.id}-{thread.id} {name}:{line}]</level> - <level>trace={extra[trace_id]} {message}</level>'
      rotation: "00:00"
      retention: "3 Days"
      enqueue: true

