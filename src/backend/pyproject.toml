[project]
name = "backend"
version = "2.6.0"
description = "BISHENG backend service"
readme = "README.md"
license = "Apache 2.0"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiomysql>=0.3.2",
    "appdirs>=1.4.4",
    "asyncpg>=0.30.0",
    "bs4>=0.0.2",
    "captcha>=0.7.1",
    # faust-cchardet is the maintained fork of cchardet (same `import cchardet`).
    # The original cchardet 2.1.7 fails to build on Python 3.11+ (longintrepr.h removed).
    "faust-cchardet>=2.1.19",
    "celery>=5.5.3",
    "chardet>=5.2.0",
    "chromadb>=1.3.4",
    "cryptography>=46.0.3",
    "dashscope>=1.24.9",
    "e2b-code-interpreter==1.5.2",
    "easyofd>=0.4.0",
    "emoji>=2.15.0",
    "fastapi>=0.120.4",
    # DB2 driver + its SQLAlchemy dialect (registers db2+ibm_db://), required
    # by the datasource engine list (F061 spec AC-02).
    #
    # The marker is PyPI's limitation, not a preference: ibm-db ships manylinux
    # x86_64/i686, macosx and win wheels, but NO aarch64 wheel. On an aarch64
    # host (the common 信创 target) resolution would fall back to the sdist,
    # which needs a separate IBM CLI-driver install and fails the build. The
    # marker keeps that host installable at the cost of dropping DB2 there.
    #
    # Both x86_64 spellings are allowed DELIBERATELY: `platform_machine` is
    # 'x86_64' on Linux and 'AMD64' on Windows, and both have wheels. Spelling
    # out only 'x86_64' would have silently dropped DB2 from every Windows dev
    # machine -- i.e. from the environment this dependency was added to be
    # testable in. An allow-list is used rather than `!= 'aarch64'` because that
    # form would also admit ppc64le / s390x / musl, none of which have a wheel
    # (macOS arm64 does have one, so it is not the reason).
    #
    # Windows caveat, measured: the pinned 3.2.7 win_amd64 wheel installs but
    # `import ibm_db` fails with a DLL-load error, because the extension needs
    # its bundled clidriver/bin on the DLL search path and Python 3.8+ no longer
    # searches PATH for a module's dependencies. `os.add_dll_directory(...)`
    # before the import fixes it. 3.3.0 imports cleanly but ships only
    # manylinux_2_34 (glibc >= 2.34), i.e. not the older 信创 targets, which is
    # why the pin has not been raised here.
    "ibm-db>=3.2.7; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "ibm-db-sa>=0.4.2; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "jieba>=0.42.1",
    "langchain>=1.3,<2.0",
    "langchain-core>=1.4,<2.0",
    "langchain-classic>=1.0.7,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "langchain-anthropic>=1.4,<2.0",
    "langchain-community>=0.4.2,<0.5.0",
    "langchain-deepseek>=1.1,<2.0",
    "langchain-elasticsearch>=1.0,<2.0",
    "langchain-experimental>=0.4.2,<0.5.0",
    "langchain-google-genai>=4.2,<5.0",
    "langchain-milvus>=0.3.3,<0.4.0",
    "langchain-ollama>=1.1,<2.0",
    "langchain-openai>=1.2,<2.0",
    "pymilvus>=2.6,<3.0",
    "langgraph>=1.2,<2.0",
    "llama-index>=0.12.52",
    "loguru>=0.7.3",
    "markdown>=3.9",
    "markdownify>=1.2.0",
    "matplotlib>=3.10.7",
    "mcp>=1.27.0",
    "minio==7.2.18",
    "miniopy-async>=1.23.4",
    "openai>=2.26,<3.0.0",
    "opencv-python>=4.12.0.88",
    "opengauss-sqlalchemy>=2.4.0",
    "openpyxl>=3.1.5",
    "oracledb>=3.4.0",
    "pandas>=2.3.3",
    "paramiko>=3.4.0",
    "pillow>=12.0.0",
    "playwright==1.57.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.10.1",
    "pymongo>=4.15.3",
    "pymupdf>=1.26.5",
    "pymysql>=1.1.2",
    # SQL parser for the datasource query guard (F061): parses model-generated
    # SQL into an AST so writes, locking reads and multi-statement input are
    # rejected structurally rather than by keyword matching.
    #
    # No DaMeng dialect exists (34 built-ins, none is `dm`). Measured, that is
    # NOT a real problem: 27 DM/Oracle constructs (ROWNUM, (+) joins, CONNECT
    # BY, NVL/DECODE, DUAL, FETCH FIRST, DM hints, VARCHAR2, @dblink, PARTITION,
    # TABLE(), Chinese identifiers) all parse under `oracle`, which is what DM
    # datasources use. The failures that DO happen come from syntax noise such
    # as `FOR UPDATE SKIP LOCKED`; those degrade to keyword validation instead
    # of being rejected (spec AC-20).
    "sqlglot>=30.18.0",
    # DaMeng database drivers — available on PyPI (Linux x86_64/aarch64, Windows).
    # dmPython bundles the dmssl package which includes the required native .so
    # files, so no separate DaMeng client installation is needed.
    # macOS has no wheel, so the marker excludes it for local development.
    "dmPython; sys_platform != 'darwin'",
    "dmAsync; sys_platform != 'darwin'",
    # SQLAlchemy dialect for DaMeng — registers dm+dmPython:// and dm+dmAsync://
    "dmSQLAlchemy; sys_platform != 'darwin'",
    # dmAsync imports async_timeout at runtime (dmAsync/pool.py) but its wheel
    # metadata fails to declare it. redis only pulls async-timeout for Python
    # < 3.11.3, so on the 3.11-slim runtime it is otherwise absent. Declare it
    # explicitly to fix dmAsync's missing transitive dependency.
    "async-timeout>=4.0.3; sys_platform != 'darwin'",
    "pypandoc>=1.15",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.15.1",
    "rapidfuzz>=3.14.3",
    "redis>=7.0.1",
    "scipy>=1.15.3",
    "shapely>=2.1.2",
    "sqlmodel>=0.0.27",
    "supabase>=2.23.3",
    "sympy>=1.14.0",
    "transformers==4.57.1",
    "uvicorn>=0.38.0",
    "weaviate-client>=4.17.0",
    "websockets>=15.0.1",
    "xlrd>=2.0.2",
    "zhipuai>=1.0.7",
    "tabulate==0.9.0",
    "httpx>=0.28.1,<0.29",
    "alembic>=1.17.1",
    "sync>=1.0.0",
    "json-repair>=0.55.0",
    "arxiv>=2.4.0",
    "simhash>=2.1.2",
    # Previously available transitively; the LangChain 1.x dependency graph no
    # longer pulls it in, but bisheng.user / sso_sync import it directly.
    "rsa>=4.9",
    "deepagents>=0.6.3,<0.7",
    "pypinyin>=0.55.0",
    "zhconv>=1.4.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis[lua]>=2.21",
    "aiosqlite>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring a running backend (deselect with '-m not e2e')",
    "slow: tests that take more than 5 seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
    "alembic",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI Depends pattern)
    "B904",   # raise from None — too strict for existing code
    "UP007",  # use X | Y for union types — requires Python 3.10+ runtime annotations
    "RUF012", # mutable class attributes — too strict for SQLModel
]

[tool.ruff.lint.isort]
known-first-party = ["bisheng", "bisheng_langchain"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
